version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Stockholm
    open-pull-requests-limit: 10
    reviewers:
      - Sundsvallskommun/web-developers
    labels:
      - dependencies
    groups:
      storybook:
        patterns:
          - '@chromatic-com/*'
          - '@storybook/*'
          - storybook
        update-types:
          - minor
          - patch
      test-tooling:
        patterns:
          - '@playwright/*'
          - '@testing-library/*'
          - '@vitest/*'
          - playwright
          - vitest
        update-types:
          - minor
          - patch
      eslint:
        patterns:
          - '@eslint/*'
          - '@typescript-eslint/*'
          - eslint
          - 'eslint-*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /mcp-server
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '05:20'
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    reviewers:
      - Sundsvallskommun/web-developers
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '05:40'
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    reviewers:
      - Sundsvallskommun/web-developers
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Stockholm
    open-pull-requests-limit: 3
    reviewers:
      - Sundsvallskommun/web-developers
    labels:
      - dependencies
